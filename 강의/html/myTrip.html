<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>나의 여행지</title>

    <!-- 구글 폰트: Gowun Batang -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap"
        rel="stylesheet"
    >

    <!-- 외부 CSS 파일 -->
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <div class="container">

        <h1>🌍 나의 여행 앨범 🎵</h1>

        <audio controls>
            <source src="./배경음악.mp3" type="audio/mpeg">
            브라우저가 오디오 재생을 지원하지 않습니다.
        </audio>

        <hr>

        <h2>📸 여행지 목록</h2>

        <div class="trip-list">
            <div class="trip-item">
                <img src="./media/런던.jpg" alt="런던 여행">
                <p class="trip-card">
                    <strong>🇬🇧 런던</strong><br>
                    2024년에 친구와 다녀온 런던 여행</p>
            </div>

            <div class="trip-item">
                <img src="./media/반포.jpg" alt="반포 여행">
                <p class="trip-card">
                    <strong>🌉 반포</strong><br>
                    2025년에 연인과 방문한 반포 한강공원의 풍경
                </p>
            </div>

            <div class="trip-item">
                <img src="./media/보라카이.jpg" alt="보라카이 여행">
                <p class="trip-card">
                    <strong>🏝️ 보라카이</strong><br>
                    2025년에 가족들과 다녀온 보라카이 여행</p>
            </div>
        </div>
        <hr>

        <h2>🎬 나의 여행 브이로그</h2>

        <video controls>
            <source src="./media/영상.mp4" type="video/mp4">
            브라우저가 동영상 재생을 지원하지 않습니다.
        </video>

    </div>
</body>
</html>
