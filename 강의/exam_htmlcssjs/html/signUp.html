<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>회원가입</title>

    <!-- 구글 폰트: Gowun Batang -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap"
        rel="stylesheet"
    >

    <!-- 외부 CSS 파일 -->
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <div class="container signup-container">
        <h1>👋 회원가입</h1>

        <p class="signup-intro">
            SKALA-FRONT 회원가입을 환영합니다.
        </p>

        <hr>

        <form action="signUpResult.html" method="get">
            <fieldset>
                <legend>계정 정보</legend>

                <div class="form-group">
                    <label for="userID">아이디</label>

                    <div class="input-area">
                        <input
                            type="text"
                            id="userID"
                            name="userID"
                            minlength="4"
                            maxlength="15"
                            required
                            placeholder="4~15자 영문/숫자"
                        >
                        <small class="required-text">필수 입력</small>
                    </div>
                </div>

                <div class="form-group">
                    <label for="userPw">비밀번호</label>

                    <div class="input-area">
                        <input
                            type="password"
                            id="userPw"
                            name="userPw"
                            minlength="8"
                            required
                            placeholder="8자 이상 입력"
                        >
                        <small class="required-text">필수 입력</small>
                    </div>
                </div>

                <div class="form-group">
                    <label for="userEmail">이메일</label>

                    <div class="input-area email-area">
                        <input
                            type="email"
                            id="userEmail"
                            name="userEmail"
                            placeholder="example"
                        >

                        <span>@</span>

                        <select name="emailDomain">
                            <option value="direct">직접 입력</option>
                            <option value="naver.com">naver.com</option>
                            <option value="gmail.com">gmail.com</option>
                            <option value="daum.net">daum.net</option>
                        </select>
                    </div>
                </div>
            </fieldset>

            <fieldset>
                <legend>개인 프로필 정보</legend>

                <div class="form-group">
                    <label for="userName">이름</label>

                    <div class="input-area">
                        <input
                            type="text"
                            id="userName"
                            name="userName"
                            required
                            placeholder="이름을 입력하세요">
                    </div>
                </div>

                <div class="form-group">
                    <label for="userBirth">생년월일</label>

                    <div class="input-area">
                        <input
                            type="date"
                            id="userBirth"
                            name="userBirth"
                        >
                    </div>
                </div>

                <div class="form-group">
                    <span class="form-label">성별</span>

                    <div class="input-area option-group">
                        <label class="option-label">
                            <input
                                type="radio"
                                name="gender"
                                value="male"
                                checked
                            >
                            남성
                        </label>

                        <label class="option-label">
                            <input
                                type="radio"
                                name="gender"
                                value="female"
                            >
                            여성
                        </label>

                        <label class="option-label">
                            <input
                                type="radio"
                                name="gender"
                                value="none"
                            >
                            선택 안 함
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <span class="form-label">관심 분야</span>

                    <div class="input-area checkbox-group">
                        <small>중복 선택 가능</small>

                        <label class="option-label">
                            <input
                                type="checkbox"
                                name="interest"
                                value="frontend"
                            >
                            웹 개발
                        </label>

                        <label class="option-label">
                            <input
                                type="checkbox"
                                name="interest"
                                value="uiux"
                            >
                            UI/UX 디자인 표준
                        </label>

                        <label class="option-label">
                            <input
                                type="checkbox"
                                name="interest"
                                value="backend"
                            >
                            백엔드 &amp; 데이터베이스
                        </label>

                        <label class="option-label">
                            <input
                                type="checkbox"
                                name="interest"
                                value="devops"
                            >
                            클라우드 &amp; 인프라
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="signupRoute">가입 경로</label>

                    <div class="input-area">
                        <select id="signupRoute" name="signupRoute">
                            <option value="">-- 선택해주세요 --</option>
                            <option value="search">검색</option>
                            <option value="sns">SNS</option>
                            <option value="friend">지인 추천</option>
                            <option value="other">기타</option>
                        </select>
                    </div>
                </div>
            </fieldset>

            <fieldset>
                <legend>자기소개</legend>

                <div class="textarea-group">
                    <label for="intro">
                        나를 표현하는 한 줄 소개 또는 가입 인사
                    </label>

                    <textarea
                        id="intro"
                        name="intro"
                        rows="6"
                        maxlength="200"
                        placeholder="여기에 내용을 입력하세요. 최대 200자까지 작성할 수 있습니다."
                    ></textarea>
                </div>
            </fieldset>

            <div class="button-group">
                <input
                    type="submit"
                    class="btn-submit"
                    value="동의하고 회원가입"
                >

                <input
                    type="reset"
                    class="btn-reset"
                    value="다시 작성"
                >
            </div>
        </form>
    </div>
</body>
</html>
