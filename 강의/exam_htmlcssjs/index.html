<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>중고차 목록 관리</title>
    <link rel="stylesheet" href="style.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <header class="page-header">
      <!-- TODO: [페이지 헤더] 수강생 구현 #1 -->
      <h1><b>중고차 목록 관리</b></h1>
      <p>차량 정보를 등록하고 관리하는 CURD 실습</p>
    </header>

    <main class="container">
      <section class="form-card">
        <h2>차량 정보 입력</h2>

        <!-- 차령 정보 입력 폼 -->
        <form id="carForm" class="car-form">

          <!-- 제조사 정보 -->
          <div class="form-row">
            <!-- TODO: [제조사 목록] 수강생 구현 #2 -->
            <label for="makerInput">제조사</label>
            <select id="makerInput" name="makerInput">
              <option value="">제조사 선택</option>
              <option value="HYUNDAI">현대</option>
              <option value="KIA">기아</option>
              <option value="GENESIS">제네시스</option>
              <option value="CHEVROLET">쉐보레</option>
              <option value="RENAULT">르노</option>
            </select>
          </div>

          <!-- 모델명 -->
          
          <div class="form-row">
            <!-- TODO: [모델명] 수강생 구현 #3 -->
            <label for="modelInput">모델명</label>
            <input
              type="text"
              id="modelInput"
              name="modelInput"
              required
              placeholder="예 : 쏘나타"
            />
          </div>



          <!-- 연식 -->
          <div class="form-row">
            <!-- TODO: [연식] 수강생 구현 #4 -->
            <label for="yearInput">연식</label>
            <input
              type="text"
              id="yearInput"
              name="yearInput"
              required
              placeholder="예 : 2021"
            />
          </div>

          <!-- 주행거리 -->
          <div class="form-row">
            <!-- TODO: [주행거리(Km)] 수강생 구현 #5 -->
            <label for="mileageInput">주행거리(Km)</label>
            <input
              type="text"
              id="mileageInput"
              name="mileageInput"
              required
              placeholder="예 : 43000"
            />
          </div>

          <!-- 가격 -->
          <div class="form-row">
            <!-- TODO: [가격(만원)] 수강생 구현 #6 -->
            <label for="priceInput">가격(만원)</label>
            <input
              type="text"
              id="priceInput"
              name="priceInput"
              required
              placeholder="예 : 1850"
            />
          </div>

          <!-- 연료 -->
          <div class="form-row">
            <!-- TODO: [연료 목록] 수강생 구현 #7 -->
            <label for="fuelInput">연료</label>
            <select id="fuelInput" name="fuelInput">
              <option value="">연료 선택</option>
              <option value="GASOLINE">가솔린</option>
              <option value="DIESEL">디젤</option>
              <option value="LPG">LPG</option>
              <option value="HYBRID">하이브리드</option>
              <option value="ELECTRIC">전기</option>
            </select>
          </div>

          <!-- 판매 상태 -->
          <div class="form-row">
            <!-- TODO: [판매 상태 목록] 수강생 구현 #8 -->
            <label for="statusInput">판매 상태</label>
            <select id="statusInput" name="statusInput">
              <option value="">판매 상태 선택</option>
              <option value="FOR_SALE">판매중</option>
              <option value="RESERVED">예약중</option>
              <option value="SOLD">판매완료</option>
              
            </select>
          </div>
          <!-- 등록 / 취소 버튼 -->
          <div class="button-area">
            <!-- TODO: [등록/취소 버튼] 수강생 구현 #9 -->
            <button type="submit" id="submitButton">등록</button>
            <button type="reset" id="cancelEditButton" hidden>취소</button>
          </div>
        </form>
      </section>

      <!-- 차량 목록 -->
      <section class="list-card">
        <div class="list-header">
          <h2>차량 목록</h2>
          <p id="countText">전체 0대 / 표시 0대</p>
        </div>

        <!-- 차량 검색 -->
        <div class="search-area">
          <!-- TODO: [차량 검색 및 필터 목록] 수강생 구현 #10 -->
          <input
            type="text"
            id="searchInput"
            placeholder="제조사 또는 모델명 검색"
          />

          <select id="statusFilter" name="statusFilter">
            <option value="전체">전체</option>
            <option value="판매중">판매중</option>
            <option value="예약중">예약중</option>
            <option value="판매완료">판매완료</option>
              
          </select>
        </div>


        <!-- empty 메시지 -->
        <p id="emptyMessage" class="empty-message">등록된 차량이 없습니다.</p>

        <!-- 차량 목록 -->
        <div id="carList" class="car-list"></div>
      </section>
    </main>
  </body>
</html>
